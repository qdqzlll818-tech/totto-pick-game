<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6ddc3">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js">
  <title>托托的小屋</title>
  <style>
    :root{
      --ink:#513d35;--muted:#92796c;--cream:#fffaf1;--paper:#fffdf8;
      --peach:#f2c6a7;--coral:#df7160;--sage:#a8bea2;--gold:#e2ad52;
      --shadow:0 18px 44px rgba(88,55,40,.16);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;overscroll-behavior:none}
    body{
      color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:
        radial-gradient(circle at 12% 9%,rgba(255,255,255,.92) 0 5%,transparent 20%),
        radial-gradient(circle at 90% 16%,rgba(255,243,214,.88) 0 7%,transparent 24%),
        linear-gradient(155deg,#fffaf1,#f7e1cc 52%,#f3cdbb);
    }
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    .app{width:min(100%,520px);min-height:100vh;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .topbar h1{margin:0;font-size:22px;letter-spacing:.05em}
    .topbar p{margin:3px 0 0;color:var(--muted);font-size:11px}
    .account{
      border:0;border-radius:14px;padding:9px 12px;background:rgba(255,255,255,.72);
      box-shadow:0 8px 20px rgba(81,61,53,.08);font-size:12px;font-weight:800;
    }
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
    .stat{padding:9px;text-align:center;border-radius:15px;background:rgba(255,255,255,.64);border:1px solid rgba(255,255,255,.8)}
    .stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted)}
    .room{
      position:relative;height:385px;overflow:hidden;border-radius:28px;
      background:
        linear-gradient(90deg,transparent 49.5%,rgba(161,125,93,.08) 50%,transparent 50.5%),
        repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 38px),
        linear-gradient(#f8e9d3 0 69%,#d6b087 69% 72%,#c59468 72%);
      box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.85);
    }
    .window{position:absolute;left:24px;top:28px;width:105px;height:120px;border:9px solid #fff7e9;border-radius:48px 48px 16px 16px;background:linear-gradient(#bcd7dc,#f5dfb4);box-shadow:0 8px 14px rgba(77,60,49,.1)}
    .window::before,.window::after{content:"";position:absolute;background:rgba(255,255,255,.72)}
    .window::before{width:4px;top:0;bottom:0;left:50%}.window::after{height:4px;left:0;right:0;top:50%}
    .shelf{position:absolute;right:24px;top:58px;width:100px;height:12px;background:#9f7453;border-radius:6px;box-shadow:0 6px 0 #7f5b42}
    .shelf::before{content:"🍎  📚  🌱";position:absolute;right:4px;bottom:15px;font-size:21px;white-space:nowrap}
    .rug{position:absolute;width:74%;height:75px;left:13%;bottom:20px;border-radius:50%;background:radial-gradient(ellipse,#f8dbbf 0 58%,#e6bda0 59% 66%,transparent 67%)}
    .speech{
      position:absolute;right:22px;top:154px;max-width:158px;padding:9px 12px;border-radius:15px 15px 3px 15px;
      background:rgba(255,255,255,.9);font-size:11px;line-height:1.5;box-shadow:0 7px 18px rgba(82,54,42,.1)
    }
    .character{
      position:absolute;left:50%;bottom:30px;transform:translateX(-50%);
      width:245px;height:275px;object-fit:contain;filter:drop-shadow(0 18px 14px rgba(79,48,33,.18));
      transition:.25s cubic-bezier(.2,.9,.3,1);
    }
    .character.bounce{animation:bounce .42s ease}
    @keyframes bounce{50%{transform:translateX(-50%) translateY(-12px) scale(1.03)}}
    .nameplate{position:absolute;left:17px;bottom:15px;padding:6px 10px;border-radius:999px;background:rgba(255,251,241,.82);font-size:10px;font-weight:800}
    .panel{margin-top:10px;padding:13px;border-radius:22px;background:rgba(255,250,242,.82);box-shadow:0 10px 28px rgba(82,52,39,.1);backdrop-filter:blur(8px)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
    .panel-head h2{margin:0;font-size:15px}.panel-head span{font-size:10px;color:var(--muted)}
    .wardrobe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .skin{
      position:relative;border:2px solid transparent;border-radius:16px;background:#fff8eb;padding:6px 4px 7px;text-align:center;min-width:0;
    }
    .skin img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
    .skin small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px}
    .skin.selected{border-color:#e88670;background:#fff1df}
    .skin.locked{filter:grayscale(.75);opacity:.55}
    .skin.locked::after{content:"🔒";position:absolute;right:4px;top:4px;font-size:13px}
    .locked-art{display:grid;place-items:center;aspect-ratio:1;font-size:34px;filter:grayscale(1)}
    .map{display:grid;gap:8px}
    .level{display:flex;align-items:center;gap:10px;padding:10px;border-radius:17px;background:#fff8ec;text-decoration:none;color:inherit}
    .level-icon{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;background:#f5d1b2;font-size:23px}
    .level-text{flex:1}.level-text b{display:block;font-size:13px}.level-text small{font-size:10px;color:var(--muted)}
    .level-reward{font-size:10px;color:#b06a48;text-align:right}
    .level.locked{opacity:.5;pointer-events:none}
    .bottom-nav{
      position:fixed;z-index:30;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);
      width:min(calc(100% - 28px),492px);display:grid;grid-template-columns:repeat(3,1fr);padding:7px;
      border-radius:20px;background:rgba(255,252,247,.92);box-shadow:0 14px 35px rgba(73,44,33,.2);backdrop-filter:blur(12px)
    }
    .nav{border:0;background:none;border-radius:14px;padding:7px;font-size:10px}.nav span{display:block;font-size:19px}.nav.active{background:#f7dfca;font-weight:800}
    .view{display:none}.view.active{display:block}
    .modal{position:fixed;inset:0;display:none;place-items:center;z-index:60;padding:22px;background:rgba(66,43,35,.3);backdrop-filter:blur(8px)}
    .modal.show{display:grid}.dialog{width:min(100%,370px);padding:24px;border-radius:27px;background:#fffaf1;box-shadow:0 25px 80px rgba(57,32,25,.3)}
    .dialog h2{margin:0 0 8px}.dialog p{margin:0 0 15px;color:var(--muted);font-size:12px;line-height:1.7}
    .dialog input{width:100%;border:1px solid #e8d6c2;border-radius:13px;background:#fff;padding:12px;margin-bottom:10px;outline:none}
    .primary{width:100%;border:0;border-radius:14px;padding:12px;background:linear-gradient(145deg,#ed8871,#d95c50);color:#fff;font-weight:800}
    .primary:disabled{opacity:.5}.secondary{width:100%;margin-top:8px;border:0;background:none;color:var(--muted);padding:8px}
    .cloud-note{padding:10px;border-radius:13px;background:#fff0d3;color:#96633e;font-size:10px;line-height:1.5;margin-bottom:12px}
    .login-status{min-height:18px;margin:0 0 8px!important;color:#b2634e!important;font-weight:700;text-align:center}
    .hidden{display:none!important}
    .app{width:min(100%,640px)}
    .topbar{position:relative;z-index:8;margin:2px 5px 12px}
    .topbar h1{font-size:21px}
    .stats{
      position:absolute;z-index:8;left:17px;right:17px;top:15px;margin:0;
      grid-template-columns:repeat(3,1fr);pointer-events:none;
    }
    .stat{
      padding:7px 5px;background:rgba(255,250,239,.72);border-color:rgba(255,255,255,.9);
      box-shadow:0 8px 18px rgba(80,49,34,.08);backdrop-filter:blur(9px);
    }
    .stat b{font-size:15px}.stat span{font-size:9px}
    .room-stage{
      position:relative;height:min(72vh,590px);min-height:475px;overflow:hidden;border-radius:34px;
      background:
        radial-gradient(circle at 48% 31%,rgba(255,255,255,.92) 0 8%,transparent 35%),
        linear-gradient(90deg,transparent 49.6%,rgba(142,96,60,.055) 50%,transparent 50.4%),
        repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 42px),
        linear-gradient(#f9e8ca 0 72%,#c98e5f 72% 74%,#aa6844 74%);
      border:1px solid rgba(255,255,255,.92);box-shadow:0 22px 60px rgba(96,56,35,.2);
      isolation:isolate;
    }
    .room-stage::after{
      content:"";position:absolute;z-index:3;left:18%;right:18%;bottom:30px;height:86px;border-radius:50%;
      background:radial-gradient(ellipse,#f9d8b9 0 54%,#e7aa7d 55% 64%,transparent 65%);
      pointer-events:none;
    }
    .room-window{
      position:absolute;z-index:1;left:23px;top:83px;width:92px;height:117px;border:8px solid #fff4df;
      border-radius:46px 46px 14px 14px;background:linear-gradient(#b9d6d4,#f5dfaa);
      box-shadow:0 8px 16px rgba(77,60,49,.1)
    }
    .room-window::before,.room-window::after{content:"";position:absolute;background:rgba(255,255,255,.75)}
    .room-window::before{width:4px;top:0;bottom:0;left:50%}.room-window::after{height:4px;left:0;right:0;top:52%}
    .mission-tag{
      position:absolute;z-index:9;left:20px;top:212px;padding:7px 10px;border-radius:999px;
      background:rgba(255,249,235,.8);color:#a7523d;font-size:10px;font-weight:900;
      box-shadow:0 8px 17px rgba(86,50,32,.09);backdrop-filter:blur(8px)
    }
    .rescue-portal{
      position:absolute;z-index:2;right:-13px;top:88px;width:128px;height:202px;border-radius:70px 0 0 70px;
      background:
        radial-gradient(ellipse at 53% 50%,#ffd77e 0 19%,#e55c3f 20% 36%,#9e2f2b 37% 54%,#613633 55% 61%,transparent 62%);
      filter:drop-shadow(0 15px 15px rgba(85,38,28,.22));
      animation:portalPulse 2.8s ease-in-out infinite;
    }
    .rescue-portal::before{content:"火锅救援";position:absolute;right:21px;top:83px;color:#fff5d8;font-size:10px;font-weight:900;writing-mode:vertical-rl;letter-spacing:.14em}
    .rescue-portal::after{content:"♨";position:absolute;left:31px;top:-39px;color:rgba(255,255,255,.72);font-size:38px;animation:steamFloat 2.4s ease-in-out infinite}
    @keyframes portalPulse{50%{transform:scale(1.035);filter:drop-shadow(0 18px 20px rgba(164,55,36,.29))}}
    @keyframes steamFloat{50%{transform:translateY(-12px);opacity:.35}}
    #tottoStage{touch-action:pan-y}
    #tottoStage canvas{position:absolute;z-index:5;inset:0;width:100%;height:100%;outline:0;cursor:pointer}
    .totto-fallback{
      position:absolute;z-index:4;left:50%;bottom:60px;transform:translateX(-50%);width:310px;height:360px;
      object-fit:contain;filter:drop-shadow(0 20px 15px rgba(79,48,33,.18));
    }
    .totto-fallback.is-3d-ready{opacity:0;pointer-events:none}
    .speech{
      z-index:8;right:65px;top:210px;max-width:150px;padding:10px 12px;border-radius:17px 17px 4px 17px;
      transition:transform .18s ease,opacity .18s ease;
    }
    .speech.talk{animation:talk .3s ease}
    @keyframes talk{50%{transform:translateY(-5px) rotate(-1deg)}}
    .nameplate{z-index:8;bottom:24px}
    .adventure{
      position:absolute;z-index:10;left:50%;bottom:30px;transform:translateX(-50%);min-width:220px;
      border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:13px 25px;
      color:#fff8e8;background:linear-gradient(135deg,#e86c4e,#bd3e36);
      box-shadow:0 10px 0 #8f362e,0 18px 28px rgba(112,45,34,.28);font-weight:900;letter-spacing:.04em;
      animation:ctaBreathe 2.2s ease-in-out infinite;
    }
    .adventure:active{transform:translate(-50%,7px);box-shadow:0 3px 0 #8f362e}
    .adventure:disabled{opacity:.85}
    @keyframes ctaBreathe{50%{box-shadow:0 10px 0 #8f362e,0 18px 35px rgba(185,67,47,.38);transform:translateX(-50%) scale(1.025)}}
    body.departing .room-stage{animation:stageDepart .85s cubic-bezier(.65,0,.25,1) forwards}
    body.departing::after{content:"";position:fixed;z-index:100;inset:0;background:radial-gradient(circle at 72% 38%,#fff1ba 0 5%,#e86c4e 25%,#8f302e 64%);animation:wipeIn .82s ease forwards;pointer-events:none}
    @keyframes stageDepart{to{transform:scale(1.04);filter:saturate(1.18)}}
    @keyframes wipeIn{from{clip-path:circle(0 at 72% 38%)}to{clip-path:circle(150% at 72% 38%)}}
    .panel{margin-top:12px}
    .panel.teaser{padding:12px 14px;background:rgba(255,250,242,.72)}
    .teaser .level{background:transparent;padding:4px 2px}
    @media(max-width:420px){
      .app{padding-left:9px;padding-right:9px}.room-stage{height:69vh;min-height:465px}
      .totto-fallback{width:270px}.rescue-portal{right:-30px}.speech{right:52px;top:205px}
      .room-window{left:13px}.mission-tag{left:12px}.wardrobe{gap:5px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><h1>托托的小屋</h1><p id="welcome">游客也可以先养托托</p></div>
      <button class="account" id="accountBtn">👤 登录同步</button>
    </header>

    <section class="view active" id="homeView">
      <div class="room-stage" id="tottoStage" aria-label="可以互动的3D托托">
        <section class="stats" aria-label="养成数据">
          <div class="stat"><b id="levelCount">0</b><span>通关关卡</span></div>
          <div class="stat"><b id="coinCount">0</b><span>托托金币</span></div>
          <div class="stat"><b id="skinCount">1</b><span>拥有皮肤</span></div>
        </section>
        <div class="room-window" aria-hidden="true"></div>
        <div class="mission-tag">🍲 火锅救援进行中</div>
        <div class="rescue-portal" aria-hidden="true"></div>
        <div class="speech" id="speech">点点我，我们一起出发吧！</div>
        <img class="totto-fallback" id="tottoFallback" src="assets/characters/totto-default.webp" alt="托托">
        <button class="adventure" id="startAdventure">和托托一起出发　➜</button>
        <div class="nameplate">Totto · 托托</div>
      </div>

      <section class="panel teaser">
        <div class="panel-head"><h2>今日状态</h2><span id="clearText">还没有救出托托</span></div>
        <div class="map">
          <a class="level" href="index.html?from=home">
            <span class="level-icon">🍲</span>
            <span class="level-text"><b>继续去火锅局</b><small>三个一样就捞走</small></span>
            <span class="level-reward">通关<br>+100 🪙</span>
          </a>
        </div>
      </section>
    </section>

    <section class="view" id="wardrobeView">
      <section class="panel">
        <div class="panel-head"><h2>托托衣柜</h2><span>点击即可换装</span></div>
        <div class="wardrobe" id="wardrobe">

    const $=s=>document.querySelector(s);
    const $$=s=>[...document.querySelectorAll(s)];
    function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch(e){return fallback}}
    let skins=[];
    let progress={completed:[],coins:0,clears:0,bestScore:0};
    let tottoController=null;
    let talking=false;
    let equipped=localStorage.getItem(EQUIPPED_KEY)||"default";

    function loadLocal(){
      skins=read(SKIN_KEY,[]);
      progress={completed:[],coins:0,clears:0,bestScore:0,...read(PROGRESS_KEY,{})};
      equipped=localStorage.getItem(EQUIPPED_KEY)||"default";
      if(equipped!=="default"&&!skins.includes(equipped))equipped="default";
    }

    function render(){
      $("#levelCount").textContent=progress.completed.length;
      $("#coinCount").textContent=progress.coins;
      $("#skinCount").textContent=1+skins.length;
      $("#clearText").textContent=progress.clears?`已经救出托托 ${progress.clears} 次`:"还没有救出托托";
      $("#hotpotStatus").textContent=progress.completed.includes("hotpot")?"已通关 ✓":"可挑战";
      $("#tottoFallback").src=ASSETS[equipped]||ASSETS.default;
      tottoController?.setSkin(equipped);
      $("#speech").textContent=equipped==="hotpot-chef"?"小厨神准备好再下一锅啦！":"今天也想和你一起去捞东西！";
      $$(".skin[data-skin]").forEach(btn=>{
        const id=btn.dataset.skin,owned=id==="default"||skins.includes(id);
        btn.disabled=!owned;btn.classList.toggle("locked",!owned);btn.classList.toggle("selected",id===equipped);
      });
    }
    $$(".skin[data-skin]").forEach(btn=>btn.addEventListener("click",()=>{
      if(btn.disabled)return;
      equipped=btn.dataset.skin;localStorage.setItem(EQUIPPED_KEY,equipped);render();
      window.TottoCloud?.syncLocalProgress().catch(()=>{});
      tottoController?.play("tap-body");
    }));
    $$(".nav").forEach(btn=>btn.addEventListener("click",()=>{
      $$(".nav").forEach(n=>n.classList.toggle("active",n===btn));
      $$(".view").forEach(v=>v.classList.toggle("active",v.id===btn.dataset.view));
      window.scrollTo({top:0,behavior:"smooth"});
    }));
    $("#accountBtn").addEventListener("click",()=>$("#loginModal").classList.add("show"));
    $("#closeLogin").addEventListener("click",()=>$("#loginModal").classList.remove("show"));
    $("#loginModal").addEventListener("click",e=>{if(e.target.id==="loginModal")e.currentTarget.classList.remove("show")});
    $("#emailLoginBtn").addEventListener("click",async()=>{
      const email=$("#emailInput").value.trim();
      const status=$("#loginStatus");
      if(!email||!$("#emailInput").validity.valid){status.textContent="请先输入正确的邮箱";return;}
      $("#emailLoginBtn").disabled=true;status.textContent="正在发送…";
      try{
        await window.TottoCloud.signInWithEmail(email);
        status.textContent="登录邮件已发送，请去邮箱点击链接";
      }catch(error){
        status.textContent="发送失败："+(error.message||"请稍后重试");
      }finally{$("#emailLoginBtn").disabled=false;}
    });
    $("#logoutBtn").addEventListener("click",async()=>{
      $("#logoutBtn").disabled=true;
      try{await window.TottoCloud.signOut();location.reload();}
      catch(error){$("#loginStatus").textContent="退出失败："+error.message;$("#logoutBtn").disabled=false;}
    });

    async function updateAccount(session){
      const signedIn=Boolean(session);
      $("#emailInput").classList.toggle("hidden",signedIn);
      $("#emailLoginBtn").classList.toggle("hidden",signedIn);
      $("#logoutBtn").classList.toggle("hidden",!signedIn);
      $("#accountBtn").textContent=signedIn?"☁️ 已登录":"👤 登录同步";
      $("#welcome").textContent=signedIn?`欢迎回来，${session.user.email}`:"游客也可以先养托托";
      $("#cloudNote").textContent=signedIn
        ?`当前账号：${session.user.email}。通关记录、金币和皮肤会自动同步。`
        :"输入邮箱后，我们会发送一封安全登录邮件。第一次登录时，本机的游客进度会自动合并到账号。";
      if(!signedIn)return;
      $("#loginStatus").textContent="正在合并云端进度…";
      try{
        await window.TottoCloud.syncLocalProgress();
        loadLocal();render();
        $("#loginStatus").textContent="云端进度已同步 ✓";
      }catch(error){
        $("#loginStatus").textContent="同步暂未完成："+(error.message||"请稍后重试");
      }
    }

    window.addEventListener("totto:cloud-synced",()=>{loadLocal();render();});
    window.TottoCloud.onAuthStateChange((event,session)=>{
      if(event==="SIGNED_IN"||event==="SIGNED_OUT")updateAccount(session);
    });
    loadLocal();
    const interactionLines={
      "tap-head":["嘿嘿，额头的小点点还在哦！","再摸一下，我会眨眼睛。","准备好去火锅局了吗？"],
      "tap-body":["痒痒的！","今天也要把食材全捞出来。","衣柜里的新衣服在等我！"]
    };
    function say(text){
      if(talking)return;
      talking=true;const speech=$("#speech");speech.textContent=text;speech.classList.add("talk");
      setTimeout(()=>{speech.classList.remove("talk");talking=false;},360);
    }
    window.addEventListener("totto-interaction",event=>{
      const lines=interactionLines[event.detail?.type]||interactionLines["tap-body"];
      say(lines[Math.floor(Math.random()*lines.length)]);
    });
    if(window.Totto3D?.mount){
      window.Totto3D.mount($("#tottoStage"),{skin:equipped,mode:"home",interactive:true})
        .then(controller=>{
          tottoController=controller;
          $("#tottoFallback").classList.add("is-3d-ready");
        })
        .catch(()=>{$("#tottoFallback").classList.remove("is-3d-ready");});
    }
    $("#startAdventure").addEventListener("click",async()=>{
      const button=$("#startAdventure");
      if(button.disabled)return;
      button.disabled=true;button.textContent="托托正在冲向火锅局…";
      document.body.classList.add("departing");
      try{await tottoController?.play("start");}catch(e){}
      setTimeout(()=>{location.href="index.html?from=home";},720);
    });
    render();
    window.TottoCloud.getSession().then(updateAccount).catch(error=>{
      $("#loginStatus").textContent="账号服务暂时不可用："+error.message;
    });
  })();
  </script>
</body>
</html>
