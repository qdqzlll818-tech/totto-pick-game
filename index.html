<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f7d7bd">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js">
  <title>托托捞捞 · 火锅局</title>
  <style>
    :root {
      --ink:#513d35;
      --muted:#8d7468;
      --cream:#fff9ef;
      --peach:#f6c8a8;
      --coral:#e96d5c;
      --red:#b93f38;
      --sage:#9fbd98;
      --gold:#e8b85e;
      --shadow:0 18px 45px rgba(91,55,41,.18);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100%; overscroll-behavior:none; }
    body {
      min-height:100vh;
      color:var(--ink);
      font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
      background:
        radial-gradient(circle at 15% 12%,rgba(255,255,255,.92) 0 4%,transparent 20%),
        radial-gradient(circle at 86% 18%,rgba(255,241,213,.9) 0 7%,transparent 24%),
        linear-gradient(155deg,#fffaf2 0%,#fbe7d2 48%,#f7d3c0 100%);
      overflow-x:hidden;
    }
    button { font:inherit; color:inherit; }
    .app {
      width:min(100%,520px);
      min-height:100vh;
      margin:auto;
      padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:10px;
      position:relative;
    }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-totto {
      width:58px; height:58px; object-fit:contain; flex:none;
      filter:drop-shadow(0 6px 7px rgba(91,55,41,.16));
    }
    .game-totto-3d{
      width:64px;height:64px;position:relative;flex:none;border-radius:20px;overflow:hidden;
      background:radial-gradient(circle at 45% 35%,#fffdf5,#f5d9b8);
      filter:drop-shadow(0 6px 7px rgba(91,55,41,.14));
    }
    .game-totto-3d canvas{position:absolute;inset:0;width:100%;height:100%}
    .game-totto-3d + .brand-totto{margin-left:-64px;transition:opacity .2s}
    .game-totto-3d.ready + .brand-totto{opacity:0;pointer-events:none}
    h1 { margin:0; font-size:20px; letter-spacing:.06em; }
    .subtitle { margin:2px 0 0; color:var(--muted); font-size:11px; }
    .score-card {
      background:rgba(255,255,255,.64); border:1px solid rgba(255,255,255,.78);
      border-radius:16px; padding:8px 12px; text-align:right; box-shadow:0 8px 20px rgba(81,61,53,.08);
    }
    .score-card b { display:block; font-size:18px; }
    .score-card span { font-size:10px; color:var(--muted); }
    .header-actions { display:flex; align-items:center; gap:7px; }
    .home-link {
      display:grid; place-items:center; width:38px; height:38px; border-radius:13px;
      background:rgba(255,255,255,.68); color:var(--ink); text-decoration:none;
      box-shadow:0 8px 20px rgba(81,61,53,.08); font-size:18px;
    }
    .status {
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
    }
    .pill {
      padding:7px 8px; text-align:center; border-radius:13px;
      background:rgba(255,255,255,.58); border:1px solid rgba(255,255,255,.72);
      font-size:11px; color:var(--muted);
    }
    .pill strong { color:var(--ink); font-size:13px; }
    .mission-strip {
      display:flex; align-items:center; justify-content:center; gap:7px;
      margin-top:-2px; color:#8d5449; font-size:11px; font-weight:700;
    }
    .mission-strip::before { content:"救援中"; color:#fff; background:#dc7160; border-radius:999px; padding:3px 8px; }
    .stage-wrap {
      flex:1; min-height:370px; position:relative; display:grid; place-items:center;
    }
    .steam { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    .steam i {
      position:absolute; bottom:63%; width:18px; height:68px; border-radius:50%;
      border-left:5px solid rgba(255,255,255,.6); filter:blur(1px);
      animation:steam 3.2s ease-in-out infinite;
    }
    .steam i:nth-child(1){left:29%;animation-delay:-.7s}
    .steam i:nth-child(2){left:49%;animation-delay:-2s;height:86px}
    .steam i:nth-child(3){left:68%;animation-delay:-1.2s}
    @keyframes steam { 0%{opacity:0;transform:translateY(25px) rotate(-8deg)} 35%{opacity:.85} 100%{opacity:0;transform:translateY(-45px) rotate(16deg)}}
    .pot-shadow {
      position:absolute; width:88%; aspect-ratio:1.65; bottom:2%;
      background:rgba(97,54,38,.2); border-radius:50%; filter:blur(15px);
    }
    .pot {
      width:min(92vw,470px); aspect-ratio:1.13; position:relative;
      border-radius:46% 46% 43% 43% / 28% 28% 52% 52%;
      background:
        radial-gradient(ellipse at 50% 35%,#bc453a 0 11%,#92352f 42%,#642a29 72%),
        #8e312e;
      border:12px solid #653b35;
      box-shadow:
        inset 0 12px 0 #c97a65,
        inset 0 -17px 22px rgba(43,16,15,.42),
        0 18px 0 #4d2b29,0 32px 45px rgba(67,33,28,.28);
      overflow:visible;
    }
    .pot::before,.pot::after {
      content:""; position:absolute; top:42%; width:17%; height:16%; z-index:-1;
      background:linear-gradient(#8a5d50,#53352f); border:6px solid #51332e;
      border-radius:18px 8px 14px 20px;
    }
    .pot::before{left:-17%}.pot::after{right:-17%;transform:scaleX(-1)}
    .broth {
      position:absolute; inset:10% 6% 12%; border-radius:48%;
      background:
        radial-gradient(circle at 20% 20%,rgba(255,199,99,.7) 0 2%,transparent 3%),
        radial-gradient(circle at 72% 35%,rgba(255,223,148,.55) 0 2%,transparent 3%),
        radial-gradient(circle at 40% 75%,rgba(117,23,21,.65) 0 2%,transparent 3%),
        radial-gradient(ellipse,#d86647 0%,#a83732 62%,#76272a 100%);
      box-shadow:inset 0 6px 13px rgba(255,208,145,.5),inset 0 -9px 14px rgba(75,13,15,.36);
      overflow:hidden;
    }
    .items { position:absolute; inset:8% 5% 11%; border-radius:46%; }
    .item {
      position:absolute; width:72px; height:72px; transform:translate(-50%,-50%) rotate(var(--r));
      border:0; background:transparent; padding:0; cursor:pointer;
      transition:filter .18s,transform .16s,opacity .18s;
      z-index:var(--z);
      filter:drop-shadow(0 9px 5px rgba(55,19,17,.3));
      touch-action:manipulation;
    }
    .item:active { transform:translate(-50%,-50%) rotate(var(--r)) scale(.9); }
    .food {
      display:block; width:100%; height:100%; object-fit:contain;
      pointer-events:none; user-select:none;
    }
    .item.pop { animation:pop .28s ease forwards; }
    @keyframes pop { to{transform:translate(-50%,-90%) scale(.2) rotate(15deg);opacity:0} }
    .tray-panel {
      background:rgba(255,250,241,.9); border:1px solid rgba(255,255,255,.9);
      border-radius:22px; padding:10px; box-shadow:var(--shadow); backdrop-filter:blur(12px);
    }
    .tray-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; font-size:11px; color:var(--muted); }
    .tray {
      display:grid; grid-template-columns:repeat(7,1fr); gap:5px; min-height:52px;
    }
    .slot {
      aspect-ratio:1; border-radius:12px; display:grid; place-items:center;
      background:linear-gradient(145deg,#eadbc7,#fff8eb);
      border:1px solid rgba(99,64,49,.14); box-shadow:inset 2px 3px 5px rgba(90,57,42,.12);
      position:relative;
    }
    .slot img { width:92%; height:92%; object-fit:contain; filter:drop-shadow(0 4px 3px rgba(70,39,28,.2)); }
    .slot.filled { animation:drop .2s cubic-bezier(.2,1.5,.5,1); }
    @keyframes drop { from{transform:translateY(-18px) scale(.65)} }
    .slot.match { animation:match .42s ease forwards; }
    @keyframes match { 45%{transform:scale(1.18);background:#ffe199} 100%{transform:scale(.15);opacity:0} }
    .reserve-row {
      display:flex; align-items:center; gap:7px; margin-top:8px; color:var(--muted); font-size:10px;
    }
    .reserve { display:grid; grid-template-columns:repeat(2,42px); gap:5px; }
    .reserve .slot { width:42px; cursor:pointer; border-style:dashed; background:#fff5e5; }
    .reserve-tip { margin-left:auto; text-align:right; line-height:1.4; }
    .tools { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
    .tool {
      border:0; border-radius:15px; padding:9px 5px; background:rgba(255,255,255,.7);
      box-shadow:0 6px 16px rgba(86,54,43,.1); font-size:11px; font-weight:700;
      cursor:pointer;
    }
    .tool span { display:block; font-size:18px; margin-bottom:1px; }
    .tool:disabled { opacity:.38; filter:grayscale(1); }
    .toast {
      position:fixed; left:50%; top:18%; transform:translate(-50%,-12px);
      background:rgba(63,44,38,.9); color:#fff; border-radius:999px; padding:9px 16px;
      font-size:12px; opacity:0; pointer-events:none; transition:.22s; z-index:40;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .modal {
      position:fixed; inset:0; display:none; place-items:center; z-index:50; padding:22px;
      background:rgba(67,43,35,.28); backdrop-filter:blur(7px);
    }
    .modal.show { display:grid; }
    .dialog {
      width:min(100%,370px); background:#fffaf1; border-radius:28px; padding:24px;
      text-align:center; box-shadow:0 25px 80px rgba(57,32,25,.28);
    }
    .dialog-character { width:min(72%,245px); max-height:245px; object-fit:contain; margin:-12px auto 2px; display:block; filter:drop-shadow(0 12px 14px rgba(87,50,38,.15)); }
    .dialog h2 { margin:0 0 7px; font-size:24px; }
    .dialog p { margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.7; }
    .reward-badge {
      display:none; width:max-content; max-width:100%; margin:0 auto 12px; padding:7px 12px;
      border-radius:999px; background:#fff0c9; color:#a45f35; font-size:12px; font-weight:800;
    }
    .reward-badge.show { display:block; }
    .primary {
      border:0; border-radius:15px; padding:12px 24px; background:linear-gradient(145deg,#ef8871,#d9584e);
      color:white; font-weight:800; box-shadow:0 8px 18px rgba(191,66,58,.28); cursor:pointer;
    }
    .secondary {
      margin-top:10px; border:0; background:none; color:var(--muted); font-size:12px; cursor:pointer;
    }
    @media (max-height:760px) {
      .app{gap:7px}.stage-wrap{min-height:315px}.pot{width:min(80vh,430px)}
      .item{width:65px;height:65px}
    }
    @media (max-width:370px) {
      .app{padding-left:9px;padding-right:9px}.pot{width:92vw}.item{width:61px;height:61px}
      .tool{font-size:11px}
    }
    @media (max-width:420px) { .tools{grid-template-columns:repeat(2,1fr)} }
    body.from-home::before{
      content:"";position:fixed;z-index:80;inset:0;pointer-events:none;
      background:radial-gradient(circle at 72% 38%,#fff1ba 0 5%,#e86c4e 25%,#8f302e 64%);
      animation:gameReveal .9s cubic-bezier(.65,0,.25,1) forwards;
    }
    @keyframes gameReveal{from{clip-path:circle(150% at 72% 38%)}to{clip-path:circle(0 at 72% 38%)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>

      items:$("#items"),tray:$("#tray"),reserve:$("#reserve"),score:$("#score"),remaining:$("#remaining"),
      combo:$("#combo"),timer:$("#timer"),trayCount:$("#trayCount"),toast:$("#toast"),
      undo:$("#undoBtn"),shuffle:$("#shuffleBtn"),move:$("#moveBtn"),reserveBtn:$("#reserveBtn"),
      shuffleLeft:$("#shuffleLeft"),moveLeft:$("#moveLeft"),reserveLeft:$("#reserveLeft"),intro:$("#intro"),
      result:$("#result"),resultCharacter:$("#resultCharacter"),resultTitle:$("#resultTitle"),
      resultText:$("#resultText"),rewardBadge:$("#rewardBadge"),brandTotto:$("#brandTotto")
    };
    const fromHome = new URLSearchParams(location.search).get("from")==="home";
    document.body.classList.toggle("from-home",fromHome);
    let state, previousState = null, timerHandle = null, lock = false, toastTimer = null, gameTotto=null;

    function rand(min,max){ return Math.random()*(max-min)+min; }
    function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
    function createGame(){
      const pool=[];
      FOOD.forEach(food => {
        for(let n=0;n<9;n++) pool.push({
          uid:food.id+"-"+n+"-"+Math.random().toString(36).slice(2,7),
          type:food.id,asset:food.asset,name:food.name,selected:false
        });
      });
      shuffleArray(pool);
      const placed=[];
      pool.forEach((item,index)=>{
        const layer=Math.floor(index/14);
        let pos=null;
        for(let attempt=0;attempt<80;attempt++){
          const candidate={x:rand(12,88),y:rand(16,84)};
          const sameLayer=placed.filter(p=>p.layer===layer);
          if(!sameLayer.some(p=>distance(candidate,p)<12)){pos=candidate;break;}
        }
        pos ||= {x:rand(13,87),y:rand(17,83)};
        Object.assign(item,pos,{layer,rotation:rand(-24,24)});
        placed.push(item);
      });
      return {
        items:placed,tray:[],reserve:[],score:0,combo:0,shuffleLeft:3,moveLeft:3,reserveLeft:2,
        startedAt:Date.now(),elapsed:0,status:"playing"
      };
    }
    function distance(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
    function shuffleArray(arr){
      for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
      return arr;
    }
    function render(){
      els.items.innerHTML="";
      state.items.filter(i=>!i.selected).forEach(item=>{
        const btn=document.createElement("button");
        btn.className="item";
        btn.style.left=item.x+"%";btn.style.top=item.y+"%";
        btn.style.setProperty("--z",10+item.layer);
        btn.style.setProperty("--r",item.rotation+"deg");
        btn.dataset.uid=item.uid;
        btn.setAttribute("aria-label","可选择的"+item.name);
        btn.innerHTML=`<img class="food" src="${item.asset}" alt="">`;
        btn.addEventListener("click",()=>pick(item.uid,btn));
        els.items.appendChild(btn);
      });
      els.tray.innerHTML="";
      for(let i=0;i<7;i++){
        const slot=document.createElement("div");
        slot.className="slot"+(state.tray[i]?" filled":"");
        if(state.tray[i]){
          const img=document.createElement("img");
          img.src=state.tray[i].asset; img.alt=state.tray[i].name;
          slot.appendChild(img); slot.dataset.uid=state.tray[i].uid;
        }
        els.tray.appendChild(slot);
      }
      els.reserve.innerHTML="";
      for(let i=0;i<2;i++){
        const slot=document.createElement("button");
        slot.className="slot"+(state.reserve[i]?" filled":"");
        slot.type="button";
        if(state.reserve[i]){
          const img=document.createElement("img");
          img.src=state.reserve[i].asset;img.alt=state.reserve[i].name;
          slot.appendChild(img);
          slot.setAttribute("aria-label","把暂存的"+state.reserve[i].name+"放回托盘");
          slot.addEventListener("click",()=>restoreReserve(i));
        }else{
          slot.disabled=true;slot.setAttribute("aria-label","空暂存位");
        }
        els.reserve.appendChild(slot);
      }
      const remaining=state.items.filter(i=>!i.selected).length;
      els.remaining.textContent=remaining;
      els.score.textContent=state.score;
      els.combo.textContent=state.combo;
      els.trayCount.textContent=state.tray.length+" / 7";
      els.shuffleLeft.textContent=state.shuffleLeft;
      els.moveLeft.textContent=state.moveLeft;
      els.reserveLeft.textContent=state.reserveLeft;
      els.undo.disabled=!previousState||state.status!=="playing";
      els.shuffle.disabled=state.shuffleLeft<=0||remaining<2||state.status!=="playing";
      els.move.disabled=state.moveLeft<=0||state.tray.length===0||state.status!=="playing";
      els.reserveBtn.disabled=state.reserveLeft<=0||state.tray.length===0||state.reserve.length>=2||state.status!=="playing";
      els.brandTotto.src=getEquippedAsset();
      save();
    }
    async function pick(uid,node){
      if(lock||state.status!=="playing") return;
      const item=state.items.find(i=>i.uid===uid);
      if(!item||item.selected) return;
      previousState=clone(state);
      item.selected=true;
      insertTray(item);
      node.classList.add("pop");
      lock=true;
      await wait(180);
      render();
      await resolveMatches();
      lock=false;
      checkEnd();
    }
    function insertTray(item){
      let index=state.tray.length;
      for(let i=state.tray.length-1;i>=0;i--){if(state.tray[i].type===item.type){index=i+1;break;}}
      state.tray.splice(index,0,{uid:item.uid,type:item.type,asset:item.asset,name:item.name});
    }
    async function resolveMatches(){
      const counts={};
      state.tray.forEach(i=>(counts[i.type]??=[]).push(i.uid));
      const type=Object.keys(counts).find(k=>counts[k].length>=3);
      if(!type) return;
      const targets=counts[type].slice(0,3);
      document.querySelectorAll(".slot").forEach(slot=>{if(targets.includes(slot.dataset.uid))slot.classList.add("match");});
      await wait(390);
      state.tray=state.tray.filter(i=>!targets.includes(i.uid));
      state.combo+=1;
      state.score+=100+Math.max(0,state.combo-1)*25;
      render();
      showToast(state.combo>1?`连消 × ${state.combo}！`:"捞走三个！");
    }
    function checkEnd(){
      if(state.items.every(i=>i.selected)&&state.tray.length===0&&state.reserve.length===0){
        state.status="won";state.elapsed=currentElapsed();save();stopTimer();
        openResult(true);return;
      }
      if(state.tray.length>=7){
        state.status="lost";state.elapsed=currentElapsed();save();stopTimer();
        openResult(false);
      }
    }
    function undo(){
      if(!previousState||lock) return;
      state=clone(previousState);previousState=null;state.startedAt=Date.now();render();startTimer();showToast("已经撤回一步");
    }
    function shuffleBoard(){
      if(state.shuffleLeft<=0||lock) return;
      previousState=clone(state);state.shuffleLeft--;
      const remaining=state.items.filter(i=>!i.selected);
      shuffleArray(remaining);
      remaining.forEach((item,index)=>{
        item.layer=Math.floor(index/12);
        item.x=rand(12,88);item.y=rand(16,84);item.rotation=rand(-24,24);
      });
      render();showToast("锅里重新翻了一遍");
    }
    function moveOut(){
      if(state.moveLeft<=0||!state.tray.length||lock) return;
      previousState=clone(state);state.moveLeft--;
      const moved=state.tray.splice(Math.max(0,state.tray.length-3),3);
      const topLayer=Math.max(0,...state.items.filter(i=>!i.selected).map(i=>i.layer))+1;
      moved.forEach((entry,index)=>{
        const item=state.items.find(i=>i.uid===entry.uid);
        if(item){item.selected=false;item.layer=topLayer;item.x=22+index*28;item.y=22+rand(-4,4);item.rotation=rand(-12,12);}
      });
      state.combo=0;render();showToast(`放回去了 ${moved.length} 个`);
    }
    function reserveOne(){
      if(state.reserveLeft<=0||!state.tray.length||state.reserve.length>=2||lock) return;
      previousState=clone(state);
      state.reserve.push(state.tray.pop());
      state.reserveLeft--;
      state.combo=0;render();showToast("先放到桌边，之后还能点回来");
    }
    function restoreReserve(index){
      if(lock||state.status!=="playing"||!state.reserve[index]) return;
      if(state.tray.length>=7){showToast("托盘满了，先消掉一些");return;}
      previousState=clone(state);
      const item=state.reserve.splice(index,1)[0];
      let target=state.tray.length;
      for(let i=state.tray.length-1;i>=0;i--){if(state.tray[i].type===item.type){target=i+1;break;}}
      state.tray.splice(target,0,item);
      render();resolveMatches().then(checkEnd);
    }
    function currentElapsed(){ return state.elapsed+(Date.now()-state.startedAt); }
    function startTimer(){
      stopTimer();
      if(state.status!=="playing") return;
      state.startedAt=Date.now();
      timerHandle=setInterval(updateTimer,1000);updateTimer();
    }
    function stopTimer(){ if(timerHandle){clearInterval(timerHandle);timerHandle=null;} }
    function updateTimer(){
      const sec=Math.floor(currentElapsed()/1000),m=Math.floor(sec/60),s=sec%60;
      els.timer.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    }
    function save(){
      const data=clone(state);
      if(state.status==="playing"){data.elapsed=currentElapsed();data.startedAt=Date.now();}
      localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    }
    function load(){
      try{
        const saved=JSON.parse(localStorage.getItem(SAVE_KEY));
        if(saved&&Array.isArray(saved.items)&&saved.status==="playing"){
          state=saved;state.startedAt=Date.now();return true;
        }
      }catch(e){}
      state=createGame();return false;
    }
    function restart(){
      stopTimer();state=createGame();previousState=null;els.result.classList.remove("show");render();startTimer();gameTotto?.play("tap-body");
    }
      gameTotto?.play(won?"win":"lose");
    function openResult(won){
      els.resultCharacter.src=won?CHEF_ASSET:TRAPPED_ASSET;
      els.resultTitle.textContent=won?"这一锅捞干净啦！":"托盘塞满啦";
      const sec=Math.floor(state.elapsed/1000);
      if(won){
        const fresh=unlockSkin("hotpot-chef");
        completeLevel();
        if(fresh)localStorage.setItem(EQUIPPED_KEY,"hotpot-chef");
        els.rewardBadge.textContent=fresh?"新皮肤解锁 · 火锅小厨神":"已拥有皮肤 · 火锅小厨神";
        els.rewardBadge.classList.add("show");
        els.resultText.textContent=`你用 ${Math.floor(sec/60)} 分 ${sec%60} 秒救出了托托，得分 ${state.score}！托托换上新皮肤来谢谢你啦。`;
      }else{
        els.rewardBadge.classList.remove("show");
        els.resultText.textContent="托托还在锅里等你！可以撤回一步，或者重新开一锅。";
      }
      els.result.classList.add("show");
    }
    function getSkins(){
      try{return JSON.parse(localStorage.getItem(SKIN_KEY))||[];}catch(e){return [];}
    }
    function hasSkin(id){return getSkins().includes(id);}
    function unlockSkin(id){
      const skins=getSkins();
      if(skins.includes(id)) return false;
      skins.push(id);localStorage.setItem(SKIN_KEY,JSON.stringify(skins));return true;
    }
    function getEquippedAsset(){
      const equipped=localStorage.getItem(EQUIPPED_KEY);
      return equipped==="hotpot-chef"&&hasSkin("hotpot-chef")?CHEF_ASSET:DEFAULT_ASSET;
    }
    function completeLevel(){
      let progress={completed:[],coins:0,clears:0,bestScore:0};
      try{progress={...progress,...JSON.parse(localStorage.getItem(PROGRESS_KEY))};}catch(e){}
      const first=!progress.completed.includes("hotpot");
      if(first)progress.completed.push("hotpot");
      progress.coins+=first?100:25;
      progress.clears+=1;
      progress.bestScore=Math.max(progress.bestScore||0,state.score);
      localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));
      window.TottoCloud?.syncLocalProgress().catch(()=>{});
    }
    function showToast(text){
      els.toast.textContent=text;els.toast.classList.add("show");
      clearTimeout(toastTimer);toastTimer=setTimeout(()=>els.toast.classList.remove("show"),1500);
    }
    function wait(ms){return new Promise(r=>setTimeout(r,ms));}

    els.undo.addEventListener("click",undo);
    els.shuffle.addEventListener("click",shuffleBoard);
    els.move.addEventListener("click",moveOut);
    els.reserveBtn.addEventListener("click",reserveOne);
    $("#againBtn").addEventListener("click",restart);
    $("#closeResult").addEventListener("click",()=>els.result.classList.remove("show"));
    $("#startBtn").addEventListener("click",()=>{els.intro.classList.remove("show");startTimer();});
    document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
    window.addEventListener("beforeunload",save);
    window.addEventListener("totto:cloud-synced",()=>{
      els.brandTotto.src=getEquippedAsset();
      gameTotto?.setSkin(localStorage.getItem(EQUIPPED_KEY)||"default");
    });

    const resumed=load();
    render();
    if(resumed){startTimer();showToast("已继续上次没有捞完的火锅");}
    else if(fromHome){startTimer();showToast("托托已经到达火锅局，开始救援！");}
    else els.intro.classList.add("show");
    if(window.Totto3D?.mount){
      window.Totto3D.mount($("#gameTotto3D"),{
        skin:localStorage.getItem(EQUIPPED_KEY)||"default",mode:"game",interactive:false
      }).then(controller=>{
        gameTotto=controller;$("#gameTotto3D").classList.add("ready");
        if(fromHome)gameTotto.play("start");
      }).catch(()=>{});
    }
    window.TottoCloud?.getSession().then(session=>{
      if(session)return window.TottoCloud.syncLocalProgress();
    }).catch(()=>{});
  })();
  </script>
</body>
</html>
