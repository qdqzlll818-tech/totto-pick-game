<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#3a2721">
  <title>托托救援队</title>
  <link rel="stylesheet" href="game.css?v=10">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <button class="pause-button" id="pauseBtn" type="button" aria-label="暂停游戏"><span aria-hidden="true"></span></button>
      <div class="level-identity">
        <img id="brandTotto" src="assets/characters/totto-default.webp" alt="">
        <div class="level-heading">
          <span id="levelEyebrow">第一关</span>
          <h1 id="levelTitle">火锅局</h1>
        </div>
      </div>
      <button class="sound-pill" id="motionStatus" type="button">翻锅感应 · 未开启</button>
    </header>

    <section class="hud" aria-label="游戏状态">
      <div><small>得分</small><strong id="score">0</strong></div>
      <div><small>剩余</small><strong id="remaining">93</strong></div>
      <div><small>时间</small><strong id="timer">00:00</strong></div>
    </section>

    <section class="mission-card">
      <span class="mission-icon" id="missionIcon">🍲</span>
      <div><small>本局任务</small><strong id="missionText">找到火锅小厨神托托</strong></div>
      <span class="combo" id="combo">连击 ×0</span>
    </section>

    <section class="theme-hud" id="themeHud" hidden aria-live="polite"></section>

    <section class="scene" id="scene">
      <div class="table-props" id="tableProps" aria-hidden="true"><span>🥢</span><span>🫙</span><span>🌿</span></div>
      <div class="pot" id="pot" aria-label="装满物品的火锅">
        <div class="pot-depth"></div>
        <div class="items" id="items"></div>
        <div class="pot-rim"></div>
      </div>
      <div class="shake-wave" id="shakeWave" aria-hidden="true"></div>
    </section>

    <section class="tray-wrap">
      <div class="tray-head">
        <span>收集槽 · 三个相同自动消除</span>
        <b><span id="trayCount">0</span>/7</b>
      </div>
      <div class="tray" id="tray" aria-label="收集槽"></div>
      <div class="reserve-row"><span>临时放置</span><div class="reserve" id="reserve"></div></div>
    </section>

    <nav class="tools" aria-label="道具">
      <button id="undoBtn" type="button"><span>↶</span><b>撤回</b><small>一步</small></button>
      <button id="shuffleBtn" type="button"><span>🧲</span><b>洗牌</b><small id="shuffleLeft">3</small></button>
      <button id="moveBtn" type="button"><span>↗</span><b>移出</b><small id="moveLeft">3</small></button>
      <button id="reserveBtn" type="button"><span>＋</span><b>暂存</b><small id="reserveLeft">2</small></button>
    </nav>
  </main>

  <div class="overlay show" id="intro">
    <section class="dialog intro-dialog">
      <div class="intro-scene">
        <div class="mini-pot"><span id="introIcon">🍲</span></div>
        <img id="introTotto" src="assets/characters/totto-default.webp" alt="等待被救出的托托">
      </div>
      <p class="eyebrow" id="introEyebrow">托托救援 · 第一关</p>
      <h2 id="introTitle">托托掉进火锅啦！</h2>
      <p id="introCopy">点击所有看得见的食材，凑齐三个就能捞走。找到三个火锅托托，把它救出来吧！</p>
      <button class="motion-choice selected" id="motionChoice" type="button">
        <span>📱</span><b>开启手机翻锅感应</b><small>像翻炒一样用力前后甩动，走路和轻晃不会触发</small>
      </button>
      <button class="primary" id="startBtn" type="button">开始救援</button>
      <button class="text-button" id="skipIntro" type="button">暂不开启翻锅感应</button>
    </section>
  </div>

  <div class="overlay" id="result">
    <section class="dialog result-dialog">
      <img id="resultCharacter" src="assets/characters/totto-hotpot-chef.webp" alt="托托">
      <span class="reward" id="rewardBadge">解锁新皮肤</span>
      <h2 id="resultTitle">救援成功！</h2>
      <p id="resultText"></p>
      <a class="primary link-button" id="nextBtn" href="home.html">回到托托小屋</a>
      <button class="secondary" id="againBtn" type="button">再玩一次</button>
    </section>
  </div>

  <div class="overlay" id="pauseMenu">
    <section class="dialog pause-dialog" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <div class="pause-main" id="pauseMain">
        <div class="pause-mark" aria-hidden="true"><i></i><i></i></div>
        <h2 id="pauseTitle">游戏暂停</h2>
        <p>托托会在这里等你，当前进度已经自动保存。</p>
        <button class="primary" id="continueBtn" type="button">继续游戏</button>
        <button class="menu-button restart-button" id="restartBtn" type="button">重新开始本关</button>
        <a class="menu-button" id="pauseHomeLink" href="home.html">返回托托小屋</a>
      </div>
      <div class="restart-confirm" id="restartConfirm" hidden>
        <div class="confirm-icon" aria-hidden="true">↻</div>
        <h2>确定重新开始？</h2>
        <p>本关的得分和已收集物品会清空，已解锁的关卡和皮肤不会受影响。</p>
        <button class="danger-button" id="confirmRestartBtn" type="button">确定重开</button>
        <button class="menu-button" id="cancelRestartBtn" type="button">先不重开</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="cloud-sync.js?v=10"></script>
  <script src="game-config.js?v=10"></script>
  <script src="theme-mechanics.js?v=10"></script>
  <script src="game-state.js?v=10"></script>
  <script src="motion-controls.js?v=10"></script>
  <script src="board-motion.js?v=10"></script>
  <script src="item-hit-test.js?v=10"></script>
  <script>
    window.fromHome = new URLSearchParams(location.search).get("from") === "home";
    window.playBrandPose = () => {
      const brand = document.querySelector("#brandTotto");
      brand.classList.remove("arrive");
      void brand.offsetWidth;
      brand.classList.add("arrive");
    };
  </script>
  <script src="game-app.js?v=10"></script>
</body>
</html>
